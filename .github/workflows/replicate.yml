name: Replicate
# Independent-hardware replications (REPLICATION.md): each runner rebuilds from
# a clean checkout and re-derives every deterministic headline number with
# tools/reproduce.rb. Manual or monthly; informational, time-boxed.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 3 * *" # 3rd of each month, 05:41 UTC

permissions:
  contents: read

jobs:
  replicate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: dtolnay/rust-toolchain@1.85.1
        if: runner.os != 'Windows'
      - name: Build
        run: rake compile
      - name: Tests
        run: rake test
      - name: Reproduce headline numbers
        shell: bash
        run: ruby tools/reproduce.rb --who="GitHub Actions ${{ matrix.os }} (run ${{ github.run_id }})" --out=out/replication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replication-${{ matrix.os }}
          path: out/replication.json
