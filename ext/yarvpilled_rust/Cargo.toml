[package]
name = "yarvpilled_rust"
version = "0.1.0"
edition = "2021"
description = "Rust world-loop kernel for YARVPILLED (C ABI, linked into the ruby.h extension)"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]

[features]
# Runs the Kani proof harnesses as randomized tests on stable Rust (cargo test --features proof-check).
proof-check = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
