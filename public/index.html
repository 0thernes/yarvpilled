<!doctype html>
<html lang="en">
<head>

<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="status">connecting to /events ...</div>
<script>
"use strict";
// Every value drawn here comes from a running CRuby process
// (server.rb -> Yarvpilled::Telemetry), live over SSE or as a recording. No client-side sim.
const C = document.getElementById("c"), g = C.getContext("2d");
const W = 1280, H = 720, WX = 12, WY = 56, WW = 768, WH = 512;
const trail = document.createElement("canvas"); trail.width = WW; trail.height = WH;
const tg = trail.getContext("2d");
const foodC = document.createElement("canvas"); const fg = foodC.getContext("2d");
const CYAN = "#00ebff", MAG = "#ff2ec4", LIME = "#78ff8c", AMBER = "#ffba30", VIOLET = "#a668ff";
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const ACT = ["GRAZE", "LEFT", "RIGHT", "DASH"];
let S = null, food = null, lineage = [], frame = 0, popHist = [], spHist = [], rain = [], fps = 0, lastMsg = 0, msgs = 0;
const ops = ["leave"];
for (let i = 0; i < 30; i++) rain.push({ x: (i * 26 + 8) % WW, y: Math.random() * WH, v: 1.5 + Math.random() * 3.5, w: "leave" });

function ingest(d) {
  msgs++;
  if (d.food) food = d.food;
  if (d.lineage) lineage = d.lineage;
  if (d.ops) for (const o of d.ops) { ops.push(o); if (ops.length > 300) ops.shift(); }
  popHist.push(d.pop); spHist.push(d.species_alive);
  if (popHist.length > 380) { popHist.shift(); spHist.shift(); }
  S = d;
}
// Three modes, all fed by real CRuby telemetry:
//  * live (default): subscribe to server.rb's SSE stream at /events
//  * ?once: render a single /state.json snapshot (handy for headless screenshots)
//  * replay (GitHub Pages): window.YP_REPLAY names a gzipped NDJSON recording of
//    Telemetry frames from a real run (tools/build_site.rb); played back at its tick rate.
const statusEl = document.getElementById("status");
if (window.YP_REPLAY) {
  statusEl.textContent = "loading recording ...";
  (async () => {
    const buf = await (await fetch(window.YP_REPLAY)).arrayBuffer();
    const head = new Uint8Array(buf, 0, 2), gz = head[0] === 0x1f && head[1] === 0x8b; // host may have decoded it already
    const text = gz ? await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
                    : new TextDecoder().decode(buf);
    const frames = text.split("\n").filter((l) => l.length).map((l) => JSON.parse(l));
    const meta = frames.shift();
    let i = 0;
    setInterval(() => {
      if (i >= frames.length) { i = 0; popHist = []; spHist = []; }
      ingest(frames[i++]);
    }, 1000 / (meta.tps || 20));
    setInterval(() => {
      statusEl.innerHTML = `replay of a real run: CRuby ${meta.ruby}${meta.yjit ? " +YJIT" : ""} | world ${meta.world} | seed ${meta.seed} | ` +
        `tick ${S ? S.t : 0}/${frames.length} | recorded ${meta.recorded} | <a href="${meta.repo}" style="color:#0ef">run it live</a>`;
      msgs = 0;
    }, 500);
  })().catch((e) => { statusEl.textContent = "could not load recording: " + e; });
} else {
  const once = location.search.includes("once");
  const es = once ? { set onerror(_) {} } : new EventSource("/events");
  if (once) fetch("/state.json").then((r) => r.json()).then(ingest);
  else es.addEventListener("frame", (ev) => ingest(JSON.parse(ev.data)));
  es.onerror = () => { statusEl.textContent = "stream lost, retrying..."; };
  setInterval(() => { statusEl.textContent = `SSE live: ${msgs} frames/s from CRuby ${S ? S.ruby : ""} ${S && S.yjit ? "+YJIT" : ""} | world ${S ? S.world.impl : ""}`; msgs = 0; }, 1000);
}

function panel(x, y, w, h, title, col) {
  g.fillStyle = "rgba(6,8,18,0.85)"; g.fillRect(x, y, w, h);
  g.strokeStyle = col; g.globalAlpha = 0.5; g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); g.globalAlpha = 1;
  g.fillStyle = col;
  for (const [bx, by] of [[x, y], [x + w - 12, y], [x, y + h - 2], [x + w - 12, y + h - 2]]) g.fillRect(bx, by, 12, 2);
  for (const [bx, by] of [[x, y], [x + w - 2, y], [x, y + h - 12], [x + w - 2, y + h - 12]]) g.fillRect(bx, by, 2, 12);
  g.font = "bold 12px 'DejaVu Sans Mono', monospace";
  const tw = g.measureText(title).width + 16;
  g.fillStyle = "#080a18"; g.fillRect(x + 14, y - 8, tw, 16);
  g.fillStyle = col; g.fillText(title, x + 22, y + 4);
}
function text(s, x, y, col, size = 10, bold = false) {
  g.font = `${bold ? "bold " : ""}${size}px 'DejaVu Sans Mono', monospace`; g.fillStyle = col; g.fillText(s, x, y);
  return x + g.measureText(s).width;
}
function hsv(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c; let r, gg, b;
  [r, gg, b] = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(h / 60) % 6];
  return [Math.round((r + m) * 255), Math.round((gg + m) * 255), Math.round((b + m) * 255)];
}
function drawFood() {
  if (!food) return;
  if (foodC.width !== food.w) { foodC.width = food.w; foodC.height = food.h; }
  const bin = atob(food.b64), img = fg.createImageData(food.w, food.h);
  for (let i = 0; i < bin.length; i++) {
    const v = bin.charCodeAt(i), t = Math.pow(v / 255, 0.8);
    img.data[i * 4] = 4 + t * 30; img.data[i * 4 + 1] = 6 + t * 120 + t * t * 40; img.data[i * 4 + 2] = 14 + t * 110; img.data[i * 4 + 3] = 255;
  }
  fg.putImageData(img, 0, 0);
  g.imageSmoothingEnabled = true; g.drawImage(foodC, WX, WY, WW, WH);
}
function world() {
  panel(WX - 4, WY - 4, WW + 8, WH + 8, "WORLD // every creature's brain is a live YARV ISeq", CYAN);
  drawFood();
  g.strokeStyle = "rgba(30,60,120,0.18)";
  for (let x = 0; x < WW; x += 32) { g.beginPath(); g.moveTo(WX + x + 0.5, WY); g.lineTo(WX + x + 0.5, WY + WH); g.stroke(); }
  for (let y = 0; y < WH; y += 32) { g.beginPath(); g.moveTo(WX, WY + y + 0.5); g.lineTo(WX + WW, WY + y + 0.5); g.stroke(); }
  // opcode rain (real opcodes from freshly compiled genomes)
  g.font = "11px 'DejaVu Sans Mono', monospace";
  rain.forEach((d, i) => {
    d.y += d.v;
    if (d.y > WH + 20) rain[i] = d = { x: (i * 26 + 8) % WW, y: -Math.random() * 200, v: 1.5 + Math.random() * 3.5, w: ops[Math.floor(Math.random() * ops.length)] };
    [...d.w].forEach((ch, k) => { const yy = d.y - k * 12; if (yy < 0 || yy > WH - 4) return; g.fillStyle = k === 0 ? "rgba(200,255,230,0.75)" : `rgba(40,200,150,${Math.max(0.1, 0.5 - k * 0.03)})`; g.fillText(ch, WX + d.x, WY + yy); });
  });
  // trails
  tg.globalCompositeOperation = "destination-out"; tg.fillStyle = "rgba(0,0,0,0.18)"; tg.fillRect(0, 0, WW, WH);
  tg.globalCompositeOperation = "lighter";
  const bySp = {};
  for (const cr of S.creatures) {
    const sp = S.species[cr[3]]; if (!sp) continue;
    (bySp[cr[3]] = bySp[cr[3]] || []).push(cr);
    const gr = tg.createRadialGradient(cr[0], cr[1], 0, cr[0], cr[1], sp.r * 1.6);
    gr.addColorStop(0, rgb(sp.c, 0.25 + sp.tr * 0.02)); gr.addColorStop(1, rgb(sp.c, 0));
    tg.fillStyle = gr; tg.fillRect(cr[0] - sp.r * 2, cr[1] - sp.r * 2, sp.r * 4, sp.r * 4);
  }
  g.save(); g.globalCompositeOperation = "lighter"; g.drawImage(trail, WX, WY); g.restore();
  for (const cr of S.creatures) {
    const sp = S.species[cr[3]]; if (!sp) continue;
    const x = WX + cr[0], y = WY + cr[1], r = sp.r, a = cr[2] * Math.PI / 32, rot = a + (cr[3] % 7) * 0.3;
    g.save(); g.shadowColor = rgb(sp.c); g.shadowBlur = 10;
    g.beginPath();
    for (let k = 0; k < sp.s; k++) { const t = rot + 2 * Math.PI * k / sp.s; g.lineTo(x + Math.cos(t) * r, y + Math.sin(t) * r); }
    g.closePath(); g.fillStyle = rgb(sp.c, 0.92); g.fill(); g.restore();
    g.beginPath(); g.arc(x, y, r * 0.42, 0, 7); g.fillStyle = "rgba(8,8,20,0.85)"; g.fill();
    g.beginPath(); g.arc(x, y, 1.3, 0, 7); g.fillStyle = "#eef"; g.fill();
    g.strokeStyle = "rgba(235,245,255,0.6)"; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * 1.7, y + Math.sin(a) * r * 1.7); g.stroke();
    if (sp.inst || (S.apex && cr[3] === S.apex.id)) { g.strokeStyle = sp.inst ? AMBER : rgb(sp.c, 0.5); g.beginPath(); g.arc(x, y, r + 2.5, 0, 7); g.stroke(); }
  }
  // speciation bursts
  for (const sid in bySp) {
    const sp = S.species[sid], age = S.t - sp.born; if (age >= 24 || sp.origin === "seed") continue;
    const cr = bySp[sid][0]; g.strokeStyle = rgb(sp.c, 1 - age / 24); g.lineWidth = 1.5;
    g.beginPath(); g.arc(WX + cr[0], WY + cr[1], 6 + age * 1.6, 0, 7); g.stroke(); g.lineWidth = 1;
    text("+#" + sid, WX + cr[0] + 8, WY + cr[1] - 6, rgb(sp.c, 1 - age / 24));
  }
  // TracePoint rewrite shockwave
  if (S.last_rewrite && S.t - S.last_rewrite.fired < 40) {
    const age = S.t - S.last_rewrite.fired;
    for (const cr of (bySp[S.last_rewrite.species] || [])) { g.strokeStyle = `rgba(255,46,196,${1 - age / 40})`; g.lineWidth = 2; g.beginPath(); g.arc(WX + cr[0], WY + cr[1], 8 + age * 0.9, 0, 7); g.stroke(); g.lineWidth = 1; }
    text(`TracePoint(:call) -> define_method  #${S.last_rewrite.species}#think REWRITTEN MID-CALL`, WX + 12, WY + WH - 28, `rgba(255,46,196,${1 - age / 40})`, 12, true);
  }
  // apex reticle
  if (S.apex && bySp[S.apex.id]) {
    const cr = bySp[S.apex.id].reduce((a, b) => (b[4] > a[4] ? b : a));
    const x = WX + cr[0], y = WY + cr[1], r = 15 + Math.sin(frame * 0.25) * 2;
    g.strokeStyle = MAG; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
    for (let k = 0; k < 4; k++) { const t = k * Math.PI / 2 + frame * 0.05; g.beginPath(); g.moveTo(x + Math.cos(t) * (r + 3), y + Math.sin(t) * (r + 3)); g.lineTo(x + Math.cos(t) * (r + 10), y + Math.sin(t) * (r + 10)); g.stroke(); }
    g.lineWidth = 1;
    const label = `APEX #${S.apex.id} E=${cr[4]} ${ACT[cr[5]]}`;
    const lx = Math.min(Math.max(x + 22, WX), WX + WW - 200), ly = Math.min(Math.max(y - 26, WY + 4), WY + WH - 20);
    g.fillStyle = "rgba(10,4,20,0.8)"; g.fillRect(lx - 4, ly - 2, label.length * 6.1 + 8, 16); g.fillStyle = MAG; g.fillRect(lx - 4, ly - 2, 2, 16);
    text(label, lx, ly + 10, "#eef");
  }
  g.fillStyle = "rgba(2,4,10,0.65)"; g.fillRect(WX + 6, WY + WH - 21, 560, 17);
  text("body: hue=opcode mix  size=sqrt(bytecode)  sides=distinct opcodes  glow=branches", WX + 12, WY + WH - 9, "#82aad2");
}
function header() {
  g.fillStyle = "#080616"; g.fillRect(0, 0, W, 46);
  for (let x = 0; x < W; x += 4) { g.fillStyle = rgb(hsv((x * 0.35 + frame * 2) % 360, 0.9, 1)); g.fillRect(x, 45, 4, 2); }
  g.save(); g.shadowColor = CYAN; g.shadowBlur = 14;
  g.font = "bold 22px 'DejaVu Sans Mono', monospace"; g.fillStyle = MAG; g.fillText("YARVPILLED", 15, 31); g.fillStyle = CYAN; g.fillText("YARVPILLED", 13, 29); g.fillStyle = "#eef"; g.fillText("YARVPILLED", 14, 30);
  g.restore();
  text(" // pure ISeq cognition // zero models", 160, 29, "#96d2ff", 14, true);
  const r1 = `ruby ${S.ruby} ${S.yjit ? "+YJIT" : "(interp)"} | world: ${({ native: "C ext (ruby.h)", c: "C ext (ruby.h)", asm: "C + x86-64 asm", rust: "Rust kernel", ruby: "pure Ruby" })[S.world.impl] || S.world.impl} | ${window.YP_REPLAY ? "REPLAY of a recorded run" : "LIVE via SSE"}`;
  const r2 = `t=${S.t}  gen ${S.gen}  pop ${S.pop}  species ${S.species_alive}  births ${S.births}  rewrites ${S.rewrites}  compacts ${S.compacts}`;
  g.textAlign = "right"; text(r1, W - 12, 17, "#78a0dc"); text(r2, W - 12, 36, AMBER); g.textAlign = "left";
}
function disasm() {
  const x = 792, y = 60, w = 476, h = 236, ap = S.apex;
  panel(x, y, w, h, `APEX MIND // ISeq.of(species_${ap ? ap.id : "?"}.think).disasm`, MAG);
  if (!ap) return;
  text(`${ap.len} words | to_binary ${ap.bin}B | cost ${ap.cost}/tick | pop ${ap.alive} | gen ${ap.gen}`, x + 10, y + 22, AMBER);
  text(ap.disasm[0].slice(0, 76), x + 10, y + 38, "#788cbe");
  const body = ap.disasm.slice(3), vis = 16;
  let off = body.length > vis ? Math.floor(frame / 5) % (body.length - vis + 6) : 0; off = Math.min(off, Math.max(body.length - vis, 0));
  const pc = Math.floor(frame / 3) % Math.max(body.length, 1);
  body.slice(off, off + vis).forEach((ln, k) => {
    const ly = y + 54 + k * 12;
    if (off + k === pc) { g.fillStyle = "rgba(255,46,196,0.25)"; g.fillRect(x + 6, ly - 10, w - 12, 13); }
    const m = ln.match(/^(\d{4}) (\S+)\s*(.*)$/);
    if (m) { let xx = text(m[1], x + 10, ly, "#5a648c"); xx = text(" " + m[2].padEnd(20), xx, ly, /^(branch|jump)/.test(m[2]) ? AMBER : CYAN); text(m[3].replace(/\s+/g, " ").slice(0, 44), xx, ly, "#c8d2e6"); }
    else text(ln.slice(0, 76), x + 10, ly, "#96a0c8");
  });
}
function opcodes() {
  const x = 792, y = 308, w = 476, h = 136;
  panel(x, y, w, h, "POPULATION OPCODE HISTOGRAM // iseq.to_a", CYAN);
  const top = S.opcodes.slice(0, 9), max = top.length ? top[0][1] : 1, total = S.opcodes.reduce((a, b) => a + b[1], 0);
  text(`top opcodes across ${S.pop} live brains`, x + 10, y + 22, "#82a0d2");
  top.forEach(([op, n], k) => {
    const ly = y + 38 + k * 11.6, bw = (w - 220) * n / max, col = hsv((190 + k * 22 + frame) % 360, 0.85, 1);
    text(op.slice(0, 22), x + 10, ly, "#bec8e6");
    g.save(); g.shadowColor = rgb(col); g.shadowBlur = 8; g.fillStyle = rgb(col, 0.9); g.fillRect(x + 150, ly - 8, bw, 8); g.restore();
    text(String(n), x + 156 + bw, ly, rgb(col));
  });
}
function gauge(cx, cy, frac, col, val, name) {
  g.lineWidth = 6; g.strokeStyle = "#1e283c"; g.beginPath(); g.arc(cx, cy, 28, 0, 7); g.stroke();
  g.save(); g.shadowColor = col; g.shadowBlur = 10 + S.flash * 30; g.strokeStyle = col; g.beginPath(); g.arc(cx, cy, 28, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * Math.min(Math.max(frac, 0), 1)); g.stroke(); g.restore();
  g.lineWidth = 1; g.textAlign = "center"; text(val, cx, cy + 4, "#eef"); text(name, cx, cy + 44, col); g.textAlign = "left";
}
function vm() {
  const x = 792, y = 456, w = 476, h = 108, gc = S.gc, o = S.objects;
  panel(x, y, w, h, "VM // GC.stat  ObjectSpace  YJIT", LIME);
  gauge(x + 44, y + 58, gc.heap_live_slots / gc.heap_available_slots, CYAN, `${Math.round(gc.heap_live_slots / 1000)}k`, "HEAP");
  gauge(x + 122, y + 58, o.T_IMEMO / (o.TOTAL - o.FREE), VIOLET, `${(o.T_IMEMO / 1000).toFixed(1)}k`, "IMEMO");
  if (S.yjit_stats) gauge(x + 200, y + 58, S.yjit_stats.inline_code / 16e6, AMBER, `${Math.round(S.yjit_stats.inline_code / 1024)}KB`, "YJIT");
  else gauge(x + 200, y + 58, gc.major_gc_count / Math.max(gc.count, 1), AMBER, `${gc.major_gc_count}/${gc.count}`, "MAJOR");
  const lc = S.last_compact;
  [["GC.count", `${gc.count} (minor ${gc.minor_gc_count} major ${gc.major_gc_count})`], ["compact", `${gc.compact_count} moved ${lc ? lc.moved : "-"}`],
   ["live/free", `${gc.heap_live_slots} / ${gc.heap_free_slots}`], ["T_CLASS", `${o.T_CLASS}  T_DATA ${o.T_DATA}`],
   ["fibers", `${S.fibers.switches} switch/tick`], ["think()", `${S.think_calls} YARV calls`], ["ractors", `${S.ractors} isolates  amnesia x${S.amnesias}`]]
    .forEach(([k, v], i) => { text(k, x + 248, y + 22 + i * 13, LIME); text(v.slice(0, 27), x + 310, y + 22 + i * 13, "#c8d7eb"); });
}
function ractors() {
  const x = 8, y = 584, w = 384, h = 128;
  panel(x, y, w, h, "RACTOR HIVE-MIND // parallel expert votes", VIOLET);
  Object.keys(S.votes).forEach((name, k) => {
    const ly = y + 22 + k * 19, col = rgb(hsv(260 + k * 18, 0.6, 1));
    text(name, x + 10, ly, col);
    const vs = S.votes[name];
    vs.forEach((v, j) => { g.fillStyle = rgb(v[1], 0.9); g.fillRect(x + 116 + j * 11, ly - 9, 9, 10); });
    const last = vs[vs.length - 1]; if (last) text(`#${last[0]} ${(last[2] / 1000).toFixed(1)}us`, x + 306, ly, "#bec8e6");
  });
}
function lineagePanel() {
  const x = 400, y = 584, w = 404, h = 128;
  panel(x, y, w, h, "LINEAGE // species tree + population", AMBER);
  const span = Math.max(S.t, 600), ix = x + 10, iw = w - 20, iy = y + 12, ih = h - 22;
  const pos = (n) => [ix + iw * n[2] / span, iy + ih * n[3]];
  const byId = {}; for (const n of lineage) byId[n[0]] = n;
  for (const n of lineage) {

    g.strokeStyle = rgb(n[4], alive ? 0.6 : 0.15); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y0); g.lineTo(x1, y1); g.stroke();
  }

  [[popHist, AMBER, 480], [spHist, MAG, Math.max(...spHist, 1)]].forEach(([hs, col, mx]) => {
    g.strokeStyle = col; g.globalAlpha = 0.7; g.beginPath();
    hs.forEach((v, k) => { const px = ix + iw * k / 380, py = iy + ih - ih * 0.45 * v / mx; k ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); g.globalAlpha = 1;

function events() {

function flash() {
  if (S.flash < 0.05) return;
  const lc = S.last_compact, compact = lc && S.t - lc.tick < 30;
  g.fillStyle = compact ? `rgba(200,255,255,${S.flash * 0.28})` : `rgba(255,46,196,${S.flash * 0.28})`; g.fillRect(WX, WY, WW, WH);
  if (!compact) return;
